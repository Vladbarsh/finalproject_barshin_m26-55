[project]
name = "finalproject-barshin-m26-55"
version = "0.1.0"
description = "Консольный валютный портфель ValutaTrade Hub"
readme = "README.md"
authors = [
    { name = "Владислав Баршин", email = "vladislav.barshin@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"
valutatrade = "valutatrade_hub.cli.interface:main"
rates-scheduler = "valutatrade_hub.parser_service.scheduler:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.valutatrade]
rates_ttl_seconds = 300
base_currency = "USD"
log_max_bytes = 1048576
log_backup_count = 3
request_timeout = 10
update_interval = 300

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
